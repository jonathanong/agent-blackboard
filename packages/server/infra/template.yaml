AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  agent-blackboard: a single Lambda Function URL (streaming) backed by one
  DynamoDB table. Deployed with `pnpm --filter agent-blackboard-server run
  deploy` (infra/deploy.mjs), which wraps `aws cloudformation deploy`.

Parameters:
  AgentBlackboardTtlDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: >-
      Days each entry is retained from its creation time before DynamoDB TTL
      deletes it. Session metadata does not expire.

  AdminCredentials:
    Type: String
    NoEcho: true
    Description: >-
      Base64 JSON [{"name","token"}] of admin credentials. Lives only in this
      parameter / the Lambda's environment — never written to DynamoDB.

  LambdaCodeS3Bucket:
    Type: String
    Description: >-
      S3 bucket holding the packaged handler zip. Supplied by
      infra/deploy.mjs, which owns this bucket's lifecycle (see README) — not
      meant to be set by hand.

  LambdaCodeS3Key:
    Type: String
    Description: >-
      S3 key (content-hash-addressed) of the packaged handler zip. Supplied
      by infra/deploy.mjs.

Resources:
  AgentBlackboardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: sessionCreatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SessionsByCreatedAt
          KeySchema:
            - AttributeName: PK
              KeyType: HASH
            - AttributeName: sessionCreatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  AgentBlackboardFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # Least privilege: only the DynamoDB actions handle-request.mts
        # actually issues against this one table. Session/entry invariants use
        # transactions; credential management uses individual item calls. No
        # CreateTable — that's an infra-time concern this template already owns.
        - PolicyName: AgentBlackboardTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt AgentBlackboardTable.Arn
              # DynamoDB authorizes GSI queries against the index ARN, not
              # the base table ARN covered by the statement above.
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub '${AgentBlackboardTable.Arn}/index/SessionsByCreatedAt'
        - PolicyName: AgentBlackboardFunctionLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # Built from the same literal name as AgentBlackboardFunction.FunctionName
                # below, NOT via !Ref/!GetAtt on AgentBlackboardFunction — referencing the
                # function resource here would create a circular dependency
                # (Function.Role -> this Role -> this policy -> Function), which
                # `aws cloudformation validate-template` rejects outright.
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/agent-blackboard-${AWS::StackName}:*'

  AgentBlackboardFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'agent-blackboard-${AWS::StackName}'
      Handler: handler.handler
      # Verified via AWS's Node.js 24 Lambda runtime announcement
      # (https://aws.amazon.com/blogs/compute/node-js-24-runtime-now-available-in-aws-lambda/):
      # nodejs24.x is a current, actively-supported managed runtime (EOL
      # ~April 2028), not a guess — this is a runtime-availability fact, not
      # a design choice. If it ever ages out, bump this to the highest
      # available managed nodejsNN.x; the esbuild bundle itself targets
      # modern JS and isn't tied to a specific runtime version.
      Runtime: nodejs24.x
      Role: !GetAtt AgentBlackboardFunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: 256
      Timeout: 300
      # DoS backstop: caps total concurrent invocations regardless of
      # traffic, at the cost of 429s under a burst above this ceiling.
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          AGENT_BLACKBOARD_TABLE: !Ref AgentBlackboardTable
          AGENT_BLACKBOARD_TTL_DAYS: !Ref AgentBlackboardTtlDays
          AGENT_BLACKBOARD_ADMIN_CREDENTIALS: !Ref AdminCredentials

  # AuthType: NONE makes the Function URL publicly reachable — the handler
  # itself is responsible for validating the bearer token on every request
  # (see src/auth). This tradeoff is deliberate: AWS_IAM auth would require
  # every caller to sign requests with AWS credentials, which defeats the
  # point of a portable `abb_sk_...`/`abb_admin_...` bearer token that agents
  # carry in an env var. ReservedConcurrentExecutions above is the backstop
  # against abuse of the public endpoint.
  AgentBlackboardFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AgentBlackboardFunction.Arn
      AuthType: NONE
      InvokeMode: RESPONSE_STREAM

  AgentBlackboardFunctionUrlPublicInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentBlackboardFunction
      FunctionUrlAuthType: NONE
      Action: lambda:InvokeFunctionUrl
      Principal: '*'

  # As of October 2025, AWS requires BOTH lambda:InvokeFunctionUrl (above) and
  # lambda:InvokeFunction (this statement) on a NONE-auth Function URL, or
  # every request 403s — see
  # https://docs.aws.amazon.com/lambda/latest/dg/urls-auth.html
  # ("If a function's resource-based policy doesn't grant
  # lambda:invokeFunctionUrl and lambda:InvokeFunction permissions, users
  # will get a 403 Forbidden error code"). InvokedViaFunctionUrl restricts
  # this grant to function-URL invocations only, not direct Invoke calls.
  AgentBlackboardFunctionPublicInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentBlackboardFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Description: Public HTTPS endpoint (set as AGENT_BLACKBOARD_URL).
    Value: !GetAtt AgentBlackboardFunctionUrl.FunctionUrl

  TableName:
    Description: DynamoDB table name (set as AGENT_BLACKBOARD_TABLE for local dev against real DynamoDB).
    Value: !Ref AgentBlackboardTable
