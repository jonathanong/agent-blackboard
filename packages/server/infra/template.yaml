AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  atel: a single Lambda Function URL (streaming) backed by one
  DynamoDB table. Deployed with `pnpm --filter atel-server run
  deploy` (infra/deploy.mjs), which wraps `aws cloudformation deploy`.

Parameters:
  # Kept as `JournalTtlDays` (not renamed to an Atel-branded name): this is a
  # template-internal parameter name, not read directly by app code (the
  # Lambda env var it feeds — see Environment.Variables below — is the
  # ATEL_TTL_DAYS-branded one). Renaming template parameter/logical-resource
  # names is intentionally out of scope for this rebrand — see the note on
  # `JournalTable` below.
  JournalTtlDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: Days a telemetry entry lives before DynamoDB TTL deletes it.

  AdminCredentials:
    Type: String
    NoEcho: true
    Description: >-
      Base64 JSON [{"name","token"}] of admin credentials. Lives only in this
      parameter / the Lambda's environment — never written to DynamoDB.

  LambdaCodeS3Bucket:
    Type: String
    Description: >-
      S3 bucket holding the packaged handler zip. Supplied by
      infra/deploy.mjs, which owns this bucket's lifecycle (see README) — not
      meant to be set by hand.

  LambdaCodeS3Key:
    Type: String
    Description: >-
      S3 key (content-hash-addressed) of the packaged handler zip. Supplied
      by infra/deploy.mjs.

Resources:
  # NOTE on naming in this file: CloudFormation logical resource IDs below
  # (JournalTable, JournalFunction, JournalFunctionRole, JournalFunctionUrl,
  # etc.), the FunctionName/log-group-ARN literal `agent-journal-` prefix,
  # the deploy-artifact S3 bucket pattern, and the default STACK_NAME (see
  # infra/deploy.mjs) are all deliberately NOT renamed to "atel" as part of
  # this rebrand. A logical-ID rename makes CloudFormation delete-and-recreate
  # that resource on the next `deploy` against the already-live "agent-journal"
  # stack — for JournalTable that would destroy the real, already-deployed
  # DynamoDB table and its data; for JournalFunction, changing FunctionName
  # similarly forces Lambda replacement. This is a branding-only source
  # change, not a live-infra change, so all of that stays as-is. Only the
  # app-level Lambda environment variable names (which are safe, in-place
  # config updates) and prose/comments are rebranded.
  JournalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  JournalFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # Least privilege: only the DynamoDB actions handle-request.mts
        # actually issues against this one table (append=PutItem,
        # get/pull=Query, patch=UpdateItem, plus GetItem/DeleteItem for
        # credential lookups+removal). No CreateTable — that's an infra-time
        # concern this template already owns.
        - PolicyName: JournalTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt JournalTable.Arn
        - PolicyName: JournalFunctionLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # Built from the same literal name as JournalFunction.FunctionName
                # below, NOT via !Ref/!GetAtt on JournalFunction — referencing the
                # function resource here would create a circular dependency
                # (Function.Role -> this Role -> this policy -> Function), which
                # `aws cloudformation validate-template` rejects outright.
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/agent-journal-${AWS::StackName}:*'

  JournalFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'agent-journal-${AWS::StackName}'
      Handler: handler.handler
      # Verified via AWS's Node.js 24 Lambda runtime announcement
      # (https://aws.amazon.com/blogs/compute/node-js-24-runtime-now-available-in-aws-lambda/):
      # nodejs24.x is a current, actively-supported managed runtime (EOL
      # ~April 2028), not a guess — this is a runtime-availability fact, not
      # a design choice. If it ever ages out, bump this to the highest
      # available managed nodejsNN.x; the esbuild bundle itself targets
      # modern JS and isn't tied to a specific runtime version.
      Runtime: nodejs24.x
      Role: !GetAtt JournalFunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: 256
      Timeout: 60
      # DoS backstop: caps total concurrent invocations regardless of
      # traffic, at the cost of 429s under a burst above this ceiling.
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          ATEL_TABLE: !Ref JournalTable
          ATEL_TTL_DAYS: !Ref JournalTtlDays
          ATEL_ADMIN_CREDENTIALS: !Ref AdminCredentials

  # AuthType: NONE makes the Function URL publicly reachable — the handler
  # itself is responsible for validating the bearer token on every request
  # (see src/auth). This tradeoff is deliberate: AWS_IAM auth would require
  # every caller to sign requests with AWS credentials, which defeats the
  # point of a portable `atl_sk_...`/`atl_admin_...` bearer token that agents
  # carry in an env var. ReservedConcurrentExecutions above is the backstop
  # against abuse of the public endpoint.
  JournalFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt JournalFunction.Arn
      AuthType: NONE
      InvokeMode: RESPONSE_STREAM

  JournalFunctionUrlPublicInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JournalFunction
      FunctionUrlAuthType: NONE
      Action: lambda:InvokeFunctionUrl
      Principal: '*'

  # As of October 2025, AWS requires BOTH lambda:InvokeFunctionUrl (above) and
  # lambda:InvokeFunction (this statement) on a NONE-auth Function URL, or
  # every request 403s — see
  # https://docs.aws.amazon.com/lambda/latest/dg/urls-auth.html
  # ("If a function's resource-based policy doesn't grant
  # lambda:invokeFunctionUrl and lambda:InvokeFunction permissions, users
  # will get a 403 Forbidden error code"). InvokedViaFunctionUrl restricts
  # this grant to function-URL invocations only, not direct Invoke calls.
  JournalFunctionPublicInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JournalFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Description: Public HTTPS endpoint (set as ATEL_URL).
    Value: !GetAtt JournalFunctionUrl.FunctionUrl

  TableName:
    Description: DynamoDB table name (set as ATEL_TABLE for local dev against real DynamoDB).
    Value: !Ref JournalTable
